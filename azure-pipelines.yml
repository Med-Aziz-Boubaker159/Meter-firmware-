trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  fwVersion: '1.0.$(Build.BuildId)'

stages:
  # 1) BUILD: package the firmware into a versioned zip
  - stage: Build
    jobs:
      - job: BuildFirmware
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: python scripts/build.py $(fwVersion)
            displayName: Build firmware package
          - publish: dist
            artifact: firmware-build
            displayName: Save build output

  # 2) TEST: run the automatic tests
  - stage: Test
    dependsOn: Build
    jobs:
      - job: UnitTests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements.txt
            displayName: Install test tools
          - script: pytest tests --junitxml=test-results.xml
            displayName: Run unit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: test-results.xml
              testRunTitle: Firmware unit tests

  # 3) VALIDATION: check the built package itself
  - stage: Validate
    dependsOn: Test
    jobs:
      - job: ValidatePackage
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - download: current
            artifact: firmware-build
          - script: python scripts/validate.py $(Pipeline.Workspace)/firmware-build
            displayName: Validate firmware package

  # 4) ARTIFACT: publish the validated, versioned firmware
  - stage: Publish
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PublishRelease
        steps:
          - download: current
            artifact: firmware-build
          - publish: $(Pipeline.Workspace)/firmware-build
            artifact: firmware-release-$(fwVersion)
            displayName: Publish versioned firmware
